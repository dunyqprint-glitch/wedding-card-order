<!-- ส่วนที่ 3: แคตตาล็อก 10 ดีไซน์ (ระบบดึงรูปและชื่ออัตโนมัติจาก GitHub) -->
  <section class="box">
    <h2>ดีไซน์การ์ดสำเร็จรูป</h2>
    <p style="font-size: 12px; color: #718096; text-align: center; margin-bottom: 12px;">จดรหัสแบบที่ชอบ เพื่อนำไปกรอกในแบบฟอร์มสั่งทำ</p>

    <!-- กล่องแสดงรูปภาพแบบไดนามิก -->
    <div id="catalog-container" class="catalog-grid">
      <p style="grid-column: span 2; text-align: center; color: #a0aec0; padding: 20px 0;">กำลังโหลดลายการ์ด...</p>
    </div>
  </section>

  <script>
    // สคริปต์ดึงไฟล์รูปภาพจาก GitHub Repository อัตโนมัติ
    const repoOwner = 'dunyqprint-glitch';
    const repoName = 'wedding-card-order';

    fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents`)
      .then(response => response.json())
      .then(files => {
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.webp'];
        // กรองเอาเฉพาะไฟล์รูปภาพ
        const imageFiles = files.filter(file => 
          imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext))
        );

        const container = document.getElementById('catalog-container');
        if (imageFiles.length === 0) {
          container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #718096;">ยังไม่มีไฟล์รูปภาพในระบบ</p>';
          return;
        }

        // วนลูปสร้างการ์ดแคตตาล็อกและตั้งรหัสอัตโนมัติ
        container.innerHTML = imageFiles.map((file, index) => {
          const code = `DN-${String(index + 1).padStart(2, '0')}`;
          // ตัดนามสกุลไฟล์ออกและแปลงขีดเป็นช่องว่างสำหรับแสดงเป็นชื่อลาย
          const displayName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]+/g, " ");

          return `
            <div class="catalog-card">
              <img src="${file.name}" alt="${code}">
              <div class="card-code">${code}</div>
              <div class="card-name" style="word-break: break-word; padding: 0 6px; font-size: 11px;">${displayName}</div>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('catalog-container').innerHTML = '<p style="grid-column: span 2; text-align: center; color: #e53e3e;">ไม่สามารถโหลดรูปภาพได้</p>';
      });
  </script>
