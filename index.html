<!-- โซนปรับแต่งการ์ดสดบนหน้าเว็บ -->
<section class="box" style="margin-top: 24px;">
  <h2>💍 ทดลองปรับแต่งการ์ดแต่งงานของคุณ</h2>
  <p style="font-size: 13px; color: #718096; text-align: center; margin-bottom: 16px;">
    เลือกลายและพิมพ์ข้อความเพื่อดูตัวอย่างแบบเรียลไทม์
  </p>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <!-- ช่องควบคุมการปรับแต่ง -->
    <div>
      <label style="font-size: 13px; font-weight: 600;">เลือกลายการ์ด:</label>
      <select id="templateSelect" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e0; margin-top: 4px;">
        <option value="anime-aesthetic-wedding-floral-border-frame--delic.png">DN-01: Anime Floral Blue & Orange</option>
        <option value="dn-02.jpg">DN-02: Modern Monogram</option>
      </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div>
        <label style="font-size: 13px; font-weight: 600;">ชื่อเจ้าบ่าว:</label>
        <input type="text" id="groomInput" placeholder="กิตติศักดิ์ (น็อต)" value="กิตติศักดิ์" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; margin-top: 4px;">
      </div>
      <div>
        <label style="font-size: 13px; font-weight: 600;">ชื่อเจ้าสาว:</label>
        <input type="text" id="brideInput" placeholder="พิมพ์มาดา (มายด์)" value="พิมพ์มาดา" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; margin-top: 4px;">
      </div>
    </div>

    <div>
      <label style="font-size: 13px; font-weight: 600;">วันที่และเวลาจัดงาน:</label>
      <input type="text" id="dateInput" value="วันเสาร์ที่ 14 พฤศจิกายน 2026 | เวลา 18:00 น." style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; margin-top: 4px;">
    </div>

    <div>
      <label style="font-size: 13px; font-weight: 600;">สถานที่จัดงาน:</label>
      <input type="text" id="venueInput" value="ห้องแกรนด์บอลรูม โรงแรมพรีเมียม กทม." style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; margin-top: 4px;">
    </div>

    <!-- กรอบแสดงตัวอย่างการ์ดสด (สัดส่วน 4x6 นิ้ว) -->
    <div style="margin-top: 16px; text-align: center;">
      <div id="cardPreview" style="position: relative; width: 100%; max-width: 320px; aspect-ratio: 4/6; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); background-color: #fff; background-size: cover; background-position: center; border: 1px solid #e2e8f0;">
        
        <!-- เลเยอร์ข้อความซ้อนทับภาพ -->
        <div style="position: absolute; inset: 0; padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,255,255,0.25);">
          <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #4a5568; margin-bottom: 8px;">Wedding Invitation</p>
          <div style="font-size: 20px; font-weight: 700; color: #1a202c; line-height: 1.3;" id="previewNames">
            กิตติศักดิ์ <br><span style="font-size: 16px; color: #e76f51;">&</span><br> พิมพ์มาดา
          </div>
          <div style="width: 40px; height: 1px; background: #cbd5e0; margin: 12px 0;"></div>
          <p id="previewDate" style="font-size: 11px; font-weight: 600; color: #2d3748; margin-bottom: 4px;">วันเสาร์ที่ 14 พฤศจิกายน 2026</p>
          <p id="previewVenue" style="font-size: 10px; color: #4a5568;">ห้องแกรนด์บอลรูม โรงแรมพรีเมียม กทม.</p>
        </div>

      </div>
    </div>

    <!-- ปุ่มสั่งทำด้วยข้อมูลที่ปรับแต่งแล้ว -->
    <button onclick="copyAndOrder()" class="btn-main" style="border: none; cursor: pointer; margin-top: 16px;">
      ✨ ใช้แบบนี้สั่งทำการ์ด 3 บาท
    </button>
  </div>
</section>

<!-- สคริปต์เรนเดอร์ข้อความสด -->
<script>
  const templateSelect = document.getElementById('templateSelect');
  const groomInput = document.getElementById('groomInput');
  const brideInput = document.getElementById('brideInput');
  const dateInput = document.getElementById('dateInput');
  const venueInput = document.getElementById('venueInput');

  const cardPreview = document.getElementById('cardPreview');
  const previewNames = document.getElementById('previewNames');
  const previewDate = document.getElementById('previewDate');
  const previewVenue = document.getElementById('previewVenue');

  function updateCard() {
    cardPreview.style.backgroundImage = `url('${templateSelect.value}')`;
    const groom = groomInput.value.trim() || 'ชื่อเจ้าบ่าว';
    const bride = brideInput.value.trim() || 'ชื่อเจ้าสาว';
    previewNames.innerHTML = `${groom}<br><span style="font-size: 15px; color: #e76f51;">&</span><br>${bride}`;
    previewDate.innerText = dateInput.value.trim() || 'กำหนดการจัดงาน';
    previewVenue.innerText = venueInput.value.trim() || 'สถานที่จัดงาน';
  }

  // ผูก Event ตรวจจับการพิมพ์แบบทันที
  templateSelect.addEventListener('change', updateCard);
  groomInput.addEventListener('input', updateCard);
  brideInput.addEventListener('input', updateCard);
  dateInput.addEventListener('input', updateCard);
  venueInput.addEventListener('input', updateCard);

  // สั่งรันครั้งแรกทันทีที่โหลดหน้าเว็บ
  updateCard();

  function copyAndOrder() {
    alert('บันทึกรายละเอียดเรียบร้อยแล้ว กำลังนำคุณไปยังฟอร์มสั่งทำ...');
    window.open('ใส่_URL_NOTION_FORM_ที่นี่', '_blank');
  }
</script>
