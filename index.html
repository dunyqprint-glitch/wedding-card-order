<script>
  // ดึงข้อมูลและแคตตาล็อกจาก config.json มาแสดงผลบนเซลล์เพจ
  fetch('config.json?t=' + Date.now())
    .then(res => res.json())
    .then(cfg => {
      // 1. อัปเดตลิงก์แบบฟอร์มสั่งซื้อ และ LINE ทุกปุ่มในหน้า
      if (cfg.orderFormUrl) {
        document.querySelectorAll('a[href*="notion"], a[href*="tally"], .btn-primary').forEach(el => {
          if (el.tagName === 'A') el.href = cfg.orderFormUrl;
        });
      }
      if (cfg.lineUrl) {
        document.querySelectorAll('a[href*="line.me"]').forEach(el => {
          el.href = cfg.lineUrl;
        });
      }

      // 2. อัปเดตพาดหัวหลัก
      const headline = document.querySelector('section.card-section h1');
      if (headline && cfg.heroHeadline) headline.innerHTML = cfg.heroHeadline;

      // 3. อัปเดตตารางราคา
      if (cfg.prices) {
        const rows = document.querySelectorAll('table tbody tr');
        if (rows.length >= 4) {
          const p100 = parseFloat(cfg.prices.p100);
          const p200 = parseFloat(cfg.prices.p200);
          const p300 = parseFloat(cfg.prices.p300);
          const p500 = parseFloat(cfg.prices.p500);

          rows[0].children[1].innerText = p100.toFixed(2) + " บ.";
          rows[0].children[3].innerText = (p100 * 100).toLocaleString() + " บาท";

          rows[1].children[1].innerText = p200.toFixed(2) + " บ.";
          rows[1].children[3].innerText = (p200 * 200).toLocaleString() + " บาท";

          rows[2].children[1].innerText = p300.toFixed(2) + " บ.";
          rows[2].children[3].innerText = (p300 * 300).toLocaleString() + " บาท";

          rows[3].children[1].innerText = "พิเศษ " + p500.toFixed(2) + " บ.";
          rows[3].children[3].innerText = (p500 * 500).toLocaleString() + " บาท";
        }
      }

      // 4. ควบคุมแถบโปรโมชันนับถอยหลัง
      const promoSection = document.querySelector('.promo-box');
      if (promoSection && cfg.promo) {
        promoSection.style.display = cfg.promo.active ? 'block' : 'none';
      }

      // 5. แสดงผลแคตตาล็อกจากรายการที่แอดมินตั้งค่าไว้
      const catalogContainer = document.getElementById('catalog-container');
      if (catalogContainer && cfg.catalog && cfg.catalog.length > 0) {
        catalogContainer.innerHTML = cfg.catalog.map(item => `
          <div class="catalog-item" onclick="applyTemplate('${item.imageUrl}')">
            <img src="${item.imageUrl}" alt="${item.code}">
            <div class="code">${item.code}</div>
            <div class="desc">${item.name}</div>
          </div>
        `).join('');
      }
    })
    .catch(err => console.log('ใช้ค่าแสดงผลตั้งต้น:', err));
</script>
