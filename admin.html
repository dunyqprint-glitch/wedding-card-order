<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUNYA Print - ระบบจัดการข้อมูลหน้าร้าน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; color: #1a202c; padding: 24px 16px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #edf2f7; color: #2b6cb0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
    input, textarea, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-save { width: 100%; background: #2f855a; color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 18px; }
    .btn-save:disabled { background: #a0aec0; cursor: not-allowed; }
    .auth-box { background: #fffaf0; border: 1px solid #feebc8; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚙️ จัดการข้อมูลหน้าร้าน DUNYA Print</h1>

  <input type="password" id="ghToken" placeholder="วาง ghp_... ของคุณที่นี่" style="background:#fff; margin-top:4px;">
  <div class="auth-box">
    <label style="color: #744210;">🔑 GitHub Personal Access Token:</label>
    <input type="password" id="ghToken" placeholder="วาง ghp_... ของคุณที่นี่" style="background:#fff; margin-top:4px;">
    <p style="font-size: 11px; color: #975a16; margin-top: 4px;">* บันทึกไว้ในเครื่องของคุณอัตโนมัติ เพื่อใช้สิทธิ์อัปเดตไฟล์ลง GitHub</p>
  </div>

  <div class="section-title">1. ข้อความหน้าแรก (Hero)</div>
  <div class="form-group">
    <label>พาดหัวหลัก (รองรับ HTML):</label>
    <input type="text" id="heroHeadline">
  </div>
  <div class="form-group">
    <label>สเปกกระดาษ:</label>
    <input type="text" id="paperSpec">
  </div>

  <div class="section-title">2. ตารางราคา (บาท/ใบ)</div>
  <div class="grid-2">
    <div class="form-group">
      <label>100 ใบ:</label>
      <input type="number" step="0.1" id="price100">
    </div>
    <div class="form-group">
      <label>200 ใบ:</label>
      <input type="number" step="0.1" id="price200">
    </div>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>300 ใบ:</label>
      <input type="number" step="0.1" id="price300">
    </div>
    <div class="form-group">
      <label>500 ใบ:</label>
      <input type="number" step="0.1" id="price500">
    </div>
  </div>
  <div class="form-group">
    <label>หมายเหตุใต้ตารางราคา:</label>
    <input type="text" id="priceNote">
  </div>

  <div class="section-title">3. โปรโมชันนับถอยหลัง</div>
  <div class="grid-2">
    <div class="form-group">
      <label>แสดงแถบโปรโมชัน:</label>
      <select id="promoActive">
        <option value="true">เปิดใช้งาน</option>
        <option value="false">ปิดแถบโปรโมชัน</option>
      </select>
    </div>
    <div class="form-group">
      <label>เวลานับถอยหลัง (ชั่วโมง):</label>
      <input type="number" id="promoHours">
    </div>
  </div>
  <div class="form-group">
    <label>ข้อความเตือน:</label>
    <input type="text" id="promoNotice">
  </div>

  <button type="button" class="btn-save" id="btnSave" onclick="saveToGitHub()">💾 บันทึกและส่งข้อมูลขึ้น GitHub</button>
</div>

<script>
  const REPO_OWNER = 'dunyqprint-glitch';
  const REPO_NAME = 'wedding-card-order';
  const FILE_PATH = 'config.json';
  let currentFileSha = '';

  // โหลดค่า Token และดึงข้อมูล config.json ปัจจุบันมาแสดง
  window.addEventListener('DOMContentLoaded', async () => {
    const savedToken = localStorage.getItem('dunya_pat');
    if (savedToken) document.getElementById('ghToken').value = savedToken;
    await fetchCurrentConfig();
  });

  async function fetchCurrentConfig() {
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?t=${Date.now()}`);
      if (!res.ok) throw new Error('ไม่สามารถโหลดไฟล์ config.json');
      const fileData = await res.json();
      currentFileSha = fileData.sha;
      
      const content = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
      document.getElementById('heroHeadline').value = content.heroHeadline || '';
      document.getElementById('paperSpec').value = content.paperSpec || '';
      document.getElementById('price100').value = content.price100 || 3.5;
      document.getElementById('price200').value = content.price200 || 3.0;
      document.getElementById('price300').value = content.price300 || 3.0;
      document.getElementById('price500').value = content.price500 || 2.8;
      document.getElementById('priceNote').value = content.priceNote || '';
      document.getElementById('promoActive').value = String(content.promoActive);
      document.getElementById('promoHours').value = content.promoHours || 8;
      document.getElementById('promoNotice').value = content.promoNotice || '';
    } catch (err) {
      alert('แจ้งเตือน: ' + err.message + ' (หากเพิ่งสร้างไฟล์ ให้รอระบบ Deploy สักครู่)');
    }
  }

  async function saveToGitHub() {
    const token = document.getElementById('ghToken').value.trim();
    if (!token) {
      alert('กรุณาใส่ GitHub Personal Access Token ก่อนทำการบันทึก');
      return;
    }
    localStorage.setItem('dunya_pat', token);

    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerText = '⏳ กำลังบันทึกข้อมูลเข้าสู่ GitHub...';

    const newConfig = {
      heroHeadline: document.getElementById('heroHeadline').value,
      paperSpec: document.getElementById('paperSpec').value,
      price100: parseFloat(document.getElementById('price100').value) || 3.5,
      price200: parseFloat(document.getElementById('price200').value) || 3.0,
      price300: parseFloat(document.getElementById('price300').value) || 3.0,
      price500: parseFloat(document.getElementById('price500').value) || 2.8,
      priceNote: document.getElementById('priceNote').value,
      promoActive: document.getElementById('promoActive').value === 'true',
      promoHours: parseInt(document.getElementById('promoHours').value) || 8,
      promoNotice: document.getElementById('promoNotice').value
    };

    // แปลงข้อมูลเป็น Base64 รองรับภาษาไทย
    const utf8Bytes = encodeURIComponent(JSON.stringify(newConfig, null, 2)).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1));
    const base64Content = btoa(utf8Bytes);

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Admin: Update store config via admin panel',
          content: base64Content,
          sha: currentFileSha
        })
      });

      if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.message || 'บันทึกไม่สำเร็จ');
      }

      const resData = await res.json();
      currentFileSha = resData.content.sha;
      alert('✅ บันทึกข้อมูลและอัปเดตขึ้น GitHub สำเร็จแล้ว!');
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '💾 บันทึกและส่งข้อมูลขึ้น GitHub';
    }
  }
</script>

</body>
</html>
