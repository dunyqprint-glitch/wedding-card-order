<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUNYA Print - ระบบจัดการหลังบ้าน (Admin)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; color: #1a202c; padding: 20px 16px; }
    .container { max-width: 580px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #2d3748; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
    input, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-save { width: 100%; background: #2b6cb0; color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 12px; }
    .btn-save:hover { background: #2c5282; }
    .auth-overlay { position: fixed; inset: 0; background: #f0f2f5; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99; }
    .auth-card { background: #fff; padding: 30px 24px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
  </style>
</head>
<body>

  <!-- ชั้นป้องกันรหัสผ่านแอดมิน -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-card">
      <h2 style="font-size: 18px; margin-bottom: 8px;">🔐 เข้าสู่ระบบหลังบ้าน</h2>
      <p style="font-size: 13px; color: #718096; margin-bottom: 16px;">กรุณากรอกรหัส PIN ผู้ดูแลระบบ DUNYA Print</p>
      <input type="password" id="adminPin" placeholder="กรอกรหัสผ่าน..." style="text-align: center; font-size: 18px; margin-bottom: 12px;">
      <button onclick="checkAuth()" class="btn-save" style="margin-top: 0;">ยืนยันสิทธิ์</button>
    </div>
  </div>

  <!-- หน้าจอแอดมินหลัก -->
  <div class="container" id="adminPanel" style="display: none;">
    <h1>⚙️ ตั้งค่าราคาและข้อมูลร้าน DUNYA Print</h1>
    
    <div class="form-group">
      <label>พาดหัวหน้าแรก (Hero Headline):</label>
      <input type="text" id="heroHeadline" value="การ์ดแต่งงานมินิมอล สวยพรีเมียม เพียงใบละ 3 บาท!">
    </div>

    <div class="form-group">
      <label>สเปกกระดาษ:</label>
      <input type="text" id="paperSpec" value="อาร์ตการ์ดขาวพรีเมียม หนา 230–260 แกรม">
    </div>

    <h3 style="font-size: 15px; margin: 20px 0 10px; border-top: 1px solid #edf2f7; padding-top: 14px;">💵 ตารางราคาสินค้า (ราคาต่อใบ)</h3>
    <div class="grid-2">
      <div class="form-group">
        <label>100 ใบ (บ./ใบ):</label>
        <input type="number" step="0.1" id="price100" value="3.5">
      </div>
      <div class="form-group">
        <label>200 ใบ (บ./ใบ):</label>
        <input type="number" step="0.1" id="price200" value="3.0">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>300 ใบ (บ./ใบ):</label>
        <input type="number" step="0.1" id="price300" value="3.0">
      </div>
      <div class="form-group">
        <label>500 ใบ (บ./ใบ):</label>
        <input type="number" step="0.1" id="price500" value="2.8">
      </div>
    </div>

    <div class="form-group">
      <label>ข้อความหมายเหตุใต้ตาราง:</label>
      <input type="text" id="priceNote" value="* ราคายังไม่รวมค่าจัดส่งพัสดุตามจริง">
    </div>

    <button onclick="saveAndSync()" class="btn-save" id="submitBtn">
      💾 บันทึกและส่งข้อมูลเข้าระบบหลังบ้าน (Sync Notion)
    </button>
  </div>

  <script>
    const CORRECT_PIN = "1234"; // เปลี่ยนรหัสผ่านตรงนี้
    const MAKE_WEBHOOK_URL = "ใส่_WEBHOOK_URL_ของ_MAKE_ตรงนี้"; // นำ Webhook URL จาก Make.com มาวาง

    function checkAuth() {
      const pin = document.getElementById('adminPin').value;
      if (pin === CORRECT_PIN) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCurrentData();
      } else {
        alert('รหัส PIN ไม่ถูกต้อง!');
      }
    }

    function loadCurrentData() {
      const saved = localStorage.getItem('dunya_global_config');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('heroHeadline').value = data.heroHeadline || '';
        document.getElementById('paperSpec').value = data.paperSpec || '';
        document.getElementById('price100').value = data.price100 || '3.5';
        document.getElementById('price200').value = data.price200 || '3.0';
        document.getElementById('price300').value = data.price300 || '3.0';
        document.getElementById('price500').value = data.price500 || '2.8';
        document.getElementById('priceNote').value = data.priceNote || '';
      }
    }

    async function saveAndSync() {
      const btn = document.getElementById('submitBtn');
      btn.innerText = "⏳ กำลังบันทึกและส่งข้อมูล...";
      btn.disabled = true;

      const configData = {
        updatedAt: new Date().toISOString(),
        heroHeadline: document.getElementById('heroHeadline').value,
        paperSpec: document.getElementById('paperSpec').value,
        price100: document.getElementById('price100').value,
        price200: document.getElementById('price200').value,
        price300: document.getElementById('price300').value,
        price500: document.getElementById('price500').value,
        priceNote: document.getElementById('priceNote').value
      };

      // 1. บันทึกลงหน่วยความจำกลางสำหรับหน้าเว็บ
      localStorage.setItem('dunya_global_config', JSON.stringify(configData));

      // 2. ส่งข้อมูลยิงตรงเข้า Make.com Webhook เพื่ออัปเดตระบบหลังบ้าน Notion
      try {
        if (MAKE_WEBHOOK_URL && MAKE_WEBHOOK_URL.startsWith('http')) {
          await fetch(MAKE_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(configData)
          });
        }
        alert("✅ อัปเดตข้อมูลและส่งเข้าสู่ระบบหลังบ้านเรียบร้อยแล้ว!");
      } catch (err) {
        console.error(err);
        alert("บันทึกลงระบบแล้ว (แต่การเชื่อมต่อ Make.com ขัดข้อง กรุณาเช็ก Webhook URL)");
      } finally {
        btn.innerText = "💾 บันทึกและส่งข้อมูลเข้าระบบหลังบ้าน (Sync Notion)";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
