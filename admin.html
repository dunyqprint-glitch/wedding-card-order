<!-- โซนตั้งค่าตัวจับเวลาและข้อความแอดมิน -->
<h3 style="margin: 20px 0 10px; font-size: 16px;">⏱️ ตั้งค่าตัวนับเวลา & ข้อความแจ้งเตือน</h3>

<div class="form-group">
  <label>เวลานับถอยหลัง (ชั่วโมง):</label>
  <input type="number" id="promoHours" value="8" min="1">
</div>

<div class="form-group">
  <label>ข้อความกระตุ้นตอนมีโปร:</label>
  <input type="text" id="promoRunningNotice" value="⚠️ สิทธิ์โปรโมชันนี้เหลือเพียง 7 คิวสุดท้ายของวันนี้เท่านั้น">
</div>

<div class="form-group">
  <label>ข้อความแจ้งเตือนเมื่อหมดเวลา:</label>
  <input type="text" id="promoExpiredNotice" value="❌ หมดเวลาโปรโมชันพิเศษแล้ว ระบบปรับเป็นราคาปกติหน้าร้าน">
</div>

<h3 style="margin: 20px 0 10px; font-size: 16px;">🏷️ ราคาเต็มหน้าร้าน (เมื่อหมดโปร)</h3>
<div class="grid-2">
  <div class="form-group">
    <label>100 ใบ (ราคาเต็ม):</label>
    <input type="number" step="0.1" id="reg100" value="5.0">
  </div>
  <div class="form-group">
    <label>200 ใบ (ราคาเต็ม):</label>
    <input type="number" step="0.1" id="reg200" value="5.0">
  </div>
</div>
<div class="grid-2">
  <div class="form-group">
    <label>300 ใบ (ราคาเต็ม):</label>
    <input type="number" step="0.1" id="reg300" value="5.0">
  </div>
  <div class="form-group">
    <label>500 ใบ (ราคาเต็ม):</label>
    <input type="number" step="0.1" id="reg500" value="4.5">
  </div>
</div>
